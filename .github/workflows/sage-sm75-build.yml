
name: Build Sage Strata SM75 Windows

on:
  push:
    branches:
      - q36-r2
    paths:
      - .github/workflows/sage-sm75-build.yml

permissions:
  contents: read

jobs:
  build:
    name: Windows CUDA 13 - RTX 2080 Ti
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout q36-r2 source
        uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit 13
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: '13.0.2'

      - name: Install CMake and Ninja
        shell: pwsh
        run: |
          python -m pip install cmake ninja
          cmake --version
          ninja --version
          nvcc --version

      - name: Configure Strata for SM75
        shell: pwsh
        run: |
          cmake -S . -B build-sm75 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTRATA_ENABLE_CUDA=ON `
            -DSTRATA_BUILD_TESTS=OFF `
            -DSTRATA_NATIVE_EXPERTS=ON `
            -DSTRATA_Q6K_EXPERTS=ON `
            -DSTRATA_MMQ_KQUANTS=ON `
            -DSTRATA_PORTABLE=ON `
            -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Compile Strata engine
        shell: pwsh
        run: |
          cmake --build build-sm75 --target strata --parallel 2

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item build-sm75/strata.exe output/
          if (Test-Path build-sm75/strata_kq.dll) {
            Copy-Item build-sm75/strata_kq.dll output/
          }
          Get-ChildItem output

      - name: Upload compiled engine
        uses: actions/upload-artifact@v4
        with:
          name: strata-q36-r2-windows-sm75
          path: output/
          if-no-files-found: error
          retention-days: 7
